name: CI

on:
  push:
    branches: [main]
    # A docs-only push ships nothing, so it needs no test run. Production's
    # `ci-passed` check (deploy.yml) knows this: for a docs-only head it looks back to
    # the newest code commit's CI run. Run CI by hand to force a full run.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  # Run the full suite (journey and a11y included) on any branch by hand.
  workflow_dispatch: {}

# Superseded pull-request runs are cancelled. Pushes to main are never cancelled and never
# share a group, so every merge keeps its own complete CI result (the release record
# depends on it) and none is dropped while queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests cannot use paths-ignore: the main ruleset requires the `backend` and
  # `frontend` checks, and a workflow filtered out by paths never reports them, which
  # blocks the merge. Instead every PR starts this 2-minute job, and a docs-only PR skips
  # the heavy jobs with `if:` (a job skipped by `if:` counts as passed for required checks).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # No pipe: under bash -eo pipefail, `git diff | grep -q` can die of SIGPIPE
          # on a large diff and read as "no code changed".
          if [ -z "$BASE" ] || ! git diff --quiet "$BASE" HEAD -- . ':(exclude)docs' ':(exclude)*.md' ':(exclude)**/*.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: tests skipped."
          fi

  backend:
    name: backend
    needs: changes
    # Run when `changes` failed too: a skipped job would read as passed to the ruleset.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AllotJar.slnx

      - name: Build
        run: dotnet build AllotJar.slnx --no-restore -c Release

      # Tests use the EF Core in-memory provider, so no SQL Server is needed.
      - name: Test
        run: dotnet test AllotJar.slnx --no-build -c Release --verbosity normal

  # The `backend` job runs on EF in-memory, which does NOT enforce foreign keys — that
  # hid a production crash where BudgetItems.SavingsId (an enforced FK to Jars.Id) was
  # written with a bare Guid.NewGuid() (fixed in #142). This job runs a handful of tests
  # against a real SQL Server to cover the three crash paths: add a line to a Savings
  # group, create a month from a starter template, and create a jar. The test project is
  # deliberately outside AllotJar.slnx so the `backend` job (no database) never runs it.
  #
  # The same job then runs the real-backend journey tests (on main and hand-started runs,
  # not on PRs): Playwright drives complete user journeys (register → seeded budget, CSV
  # import round-trip + dedup, invite → accept) against a LIVE .NET API + this SQL Server,
  # with the SPA served by Vite proxying /api to the API. This is the only layer that
  # exercises the whole stack over HTTP — the a11y specs stub every request, and the
  # backend job runs on the FK-blind in-memory provider. The API + Vite are booted/torn
  # down by Playwright's webServer (playwright.journey.config.ts). The two used to be
  # separate jobs; sharing one runner and one SQL Server saves a second set-up (the repo
  # is private, 2,000 free minutes a month, and PRs run only the integration steps).
  integration:
    name: integration
    needs: changes
    # Run when `changes` failed too: a skipped job would read as passed to the ruleset.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'AllotJar!Str0ngP4ss'
        ports:
          - 1433:1433
    env:
      # Throwaway CI databases on the service container (the fixture and the API migrate
      # them). Not secrets — they only ever reach this ephemeral container. Encrypt=False
      # skips TLS. The signing key only ever signs tokens for the journey DB.
      INTEGRATION_TEST_CONNECTION: 'Server=localhost,1433;Database=AllotJar_IntegrationTests;User Id=sa;Password=AllotJar!Str0ngP4ss;TrustServerCertificate=True;Encrypt=False'
      JOURNEY_TEST_CONNECTION: 'Server=localhost,1433;Database=AllotJar_Journey;User Id=sa;Password=AllotJar!Str0ngP4ss;TrustServerCertificate=True;Encrypt=False'
      JOURNEY_JWT_KEY: 'journey-e2e-signing-key-not-a-secret-0123456789'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/AllotJar.IntegrationTests/AllotJar.IntegrationTests.csproj

      - name: Build
        run: dotnet build tests/AllotJar.IntegrationTests/AllotJar.IntegrationTests.csproj --no-restore -c Release

      # The fixture waits for the mssql container to accept queries, applies the
      # migrations once to one throwaway database, then runs the FK crash-path tests.
      - name: Test
        run: dotnet test tests/AllotJar.IntegrationTests/AllotJar.IntegrationTests.csproj --no-build -c Release --verbosity normal

      - name: Setup Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Pre-build the API so Playwright's `dotnet run` webServer starts fast and deterministically.
      - name: Build API
        if: github.event_name != 'pull_request'
        run: dotnet build src/AllotJar.Api/AllotJar.Api.csproj -c Release

      - name: Install client deps
        if: github.event_name != 'pull_request'
        working-directory: client
        run: npm ci

      - name: Cache Playwright Chromium
        if: github.event_name != 'pull_request'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      # The browser is cached; the system libraries it needs are not.
      - name: Install Playwright system libraries
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium

      - name: Journey tests
        if: github.event_name != 'pull_request'
        working-directory: client
        run: npm run test:e2e:journey

      # Traces/screenshots/video are retained on failure — upload them for debugging.
      - name: Upload Playwright artifacts
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: journey-playwright-report
          path: |
            client/test-results
            client/playwright-report
          retention-days: 3

  frontend:
    name: frontend
    needs: changes
    # Run when `changes` failed too: a skipped job would read as passed to the ruleset.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # ESLint over the client, its tests and the e2e specs.
      - name: Lint
        run: npm run lint

      # Vitest unit + React Testing Library tests.
      - name: Test
        run: npm run test

      # Runs tsc type-check + vite production build.
      - name: Build
        run: npm run build

  a11y:
    name: a11y
    # Browser suites cost about half of CI's minutes, and the repo is private (2,000
    # free minutes a month), so they run on main and on hand-started runs, not on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser is cached; the system libraries it needs are not.
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Drives the app in headless Chromium and asserts no axe-core WCAG 2.x A/AA
      # violations on each page, in both light and dark themes.
      - name: Accessibility (axe) checks
        run: npm run test:e2e

  # Guards the pure decision logic behind the provisioning scripts (wildcard cert
  # coverage, SSL rebind decisions, the backup task's R2 arguments). Seconds to run;
  # not a required check, but red here means a provisioning run could mis-bind TLS
  # or downgrade the off-host backup task.
  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Deploy helper tests
        shell: pwsh
        run: ./deploy/tests/Test-DeployHelpers.ps1
