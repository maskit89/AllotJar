name: Security scan

# Weekly (after Dependabot's Thursday batch) and on demand, not on every push: the repo is
# private (2,000 free Actions minutes a month) and Dependabot opens the actual fix PRs.
# Not a required check; it shows red so it gets noticed. Run it by hand from the Actions
# tab (Security scan > Run workflow) before a production deploy if you want a fresh answer.
on:
  schedule:
    - cron: '30 7 * * 4'
  workflow_dispatch: {}

jobs:
  security-scan:
    name: security-scan
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AllotJar.slnx

      # `dotnet list --vulnerable` always exits 0, so detect advisories from its output.
      - name: NuGet vulnerable packages
        run: |
          set -o pipefail
          dotnet list AllotJar.slnx package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found — see the log above."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm audit (client)
        working-directory: client
        run: npm audit --audit-level=high
