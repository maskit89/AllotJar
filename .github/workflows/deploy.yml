name: Deploy

# One pipeline, two environments, every merge to main:
#
#   build-staging ──► deploy-staging (auto)          staging.allotjar.com
#                                    └► deploy-production (manual run only)
#   build-production ────────────────┘               allotjar.com / www
#
# * STAGING auto-deploys on every merge. It is the IP-allowlisted test environment
#   (Cloudflare WAF rule) with the amber staging banner + data-loss signup consent
#   (VITE_APP_ENV=staging) and NO GA measurement ID (analytics stays inert there).
# * PRODUCTION deploys only when the owner starts this workflow by hand (Actions >
#   Deploy > Run workflow, branch main, "Also deploy to production" ticked). A
#   merge never reaches production on its own. This replaces the `production`
#   environment's required reviewer: GitHub ignores environment protection rules
#   on a private repository on the Free, Pro and Team plans, so that gate stopped
#   applying when the repo went private (3 Oct 2026). The production job still
#   runs AFTER deploy-staging in the same run, so nothing reaches production that
#   staging didn't get first.
# * Both stacks live on the same VPS. Each deploy job signs in with its own stack's
#   upload-only key (VPS_SSH_KEY_STAGING / VPS_SSH_KEY_PRODUCTION), which can only upload
#   into that stack's folder; the server's own task deploys it (see the deploy jobs).
#   Every server-side name says which stack it belongs to:
#     staging     C:\inetpub\allotjar-staging\{api,web}, pools AllotJar-Staging-Api/-Web,
#                 API :5000, ASPNETCORE_ENVIRONMENT=Staging (appsettings.Staging.json),
#                 database AllotJarStaging, release unpacked in C:\deploy\release-staging
#     production  C:\inetpub\allotjar-prod\{api,web}, pools AllotJar-Prod-Api/-Web,
#                 API :5001, ASPNETCORE_ENVIRONMENT=Production (appsettings.Production.json),
#                 database AllotJarProd, release unpacked in C:\deploy\release-production
#
# The staging and production bundles differ at build time (banner/consent/GA are
# inlined by Vite), so each environment builds its own artifact - "build once,
# deploy many" intentionally does NOT apply.
on:
  push:
    branches: [main]
    # A docs-only merge changes nothing that ships, so it does not redeploy staging.
    # Run the workflow by hand to force a deploy.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      production:
        description: 'Also deploy to production (after staging). Leave unticked to redeploy staging only.'
        type: boolean
        required: false
        default: false

jobs:
  build-staging:
    name: build release (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Framework-dependent win-x64 publish. The .NET Hosting Bundle on the VPS
      # supplies the runtime + ASP.NET Core Module; publish emits the ANCM web.config.
      - name: Publish API
        run: >
          dotnet publish src/AllotJar.Api/AllotJar.Api.csproj
          -c Release -r win-x64 --no-self-contained -o publish/api

      - name: Build SPA
        working-directory: client
        # VITE_APP_ENV=staging turns on the staging banner + data-loss consent.
        # VITE_GA_MEASUREMENT_ID is deliberately NOT set: absent => analytics is
        # disabled entirely, so staging traffic never pollutes GA.
        # VITE_GOOGLE_CLIENT_ID is likewise NOT set: staging's API has no Google
        # config, so a rendered button would only produce failing sign-ins.
        env:
          VITE_APP_ENV: staging
        run: |
          npm ci
          npm run build

      - name: Assemble release package
        run: |
          mkdir -p release/api release/web
          cp -r publish/api/. release/api/
          cp -r client/dist/. release/web/
          cp deploy/web/web.config release/web/web.config
          cp deploy/Deploy.ps1 release/Deploy.ps1
          cp deploy/ProvisionHelpers.psm1 release/ProvisionHelpers.psm1
          # The upload-only deploy's server scripts travel with every release (bin\) and the commit
          # is recorded (COMMIT). Neither is trusted on the server: the upload account controls the
          # unpacked release, so nothing in it is ever run by hand as is. A reviewed server step
          # checks each file's hash against a main commit first (docs/deployment/README.md).
          mkdir -p release/bin
          cp deploy/Invoke-PendingDeploy.ps1 deploy/Approve-DeployScripts.ps1 deploy/Enable-UploadOnlyDeploy.ps1 release/bin/
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT
          cd release && zip -qr ../release.zip . && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-staging
          path: release.zip
          retention-days: 1

  deploy-staging:
    name: deploy to staging
    needs: build-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    # Serialize staging deploys without ever blocking on a production deploy
    # below - hence job-level, not workflow-level, groups.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-staging

      # Upload-only deploy (holistic review M5): the staging key belongs to the Windows account
      # allotjar-up-staging, which sshd lets in to sftp only, inside its own upload folder. It cannot
      # run anything on the VPS. The server's every-minute task (deploy/Invoke-PendingDeploy.ps1)
      # deploys the upload with the server's own trusted Deploy.ps1 and writes back status.txt.
      - name: Get the deploy scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: src

      - name: Write SSH key and pinned host key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY_STAGING }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: allotjar-up-staging
        run: src/.github/scripts/write-ssh-config.sh

      - name: Upload the release and wait for the server to deploy it
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-staging
        run: src/.github/scripts/upload-deploy.sh staging

  # Production ships only a commit whose CI on main passed (ci-passed.yml).
  ci-passed:
    name: CI passed
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-passed.yml

  build-production:
    name: build release (production)
    needs: ci-passed
    # Production builds and deploys only on a hand-started run from main with the
    # production box ticked; a merge (push) skips both production jobs.
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Publish API
        run: >
          dotnet publish src/AllotJar.Api/AllotJar.Api.csproj
          -c Release -r win-x64 --no-self-contained -o publish/api

      - name: Build SPA
        working-directory: client
        # Production bundle: no banner, no extra consent, GA measurement ID and the
        # (public) Google OAuth client id inlined. Absent VITE_GOOGLE_CLIENT_ID =>
        # the Sign in with Google button simply doesn't render.
        env:
          VITE_APP_ENV: production
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Assemble release package
        run: |
          mkdir -p release/api release/web
          cp -r publish/api/. release/api/
          cp -r client/dist/. release/web/
          cp deploy/web/web.config release/web/web.config
          cp deploy/Deploy.ps1 release/Deploy.ps1
          cp deploy/ProvisionHelpers.psm1 release/ProvisionHelpers.psm1
          # The upload-only deploy's server scripts travel with every release (bin\) and the commit
          # is recorded (COMMIT). Neither is trusted on the server: the upload account controls the
          # unpacked release, so nothing in it is ever run by hand as is. A reviewed server step
          # checks each file's hash against a main commit first (docs/deployment/README.md).
          mkdir -p release/bin
          cp deploy/Invoke-PendingDeploy.ps1 deploy/Approve-DeployScripts.ps1 deploy/Enable-UploadOnlyDeploy.ps1 release/bin/
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT
          cd release && zip -qr ../release.zip . && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-production
          path: release.zip
          retention-days: 7

  deploy-production:
    name: deploy to production (manual run)
    # Staging must have deployed this commit first. The manual gate is the hand-started
    # run itself; the condition is repeated from build-production so this job can never
    # run on a merge. Production deploys queue one at a time.
    needs: [build-production, deploy-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-production

      # Upload-only deploy (holistic review M5): the production key belongs to the Windows account
      # allotjar-up-prod, which sshd lets in to sftp only, inside its own upload folder. It cannot
      # run anything on the VPS. The server's every-minute task (deploy/Invoke-PendingDeploy.ps1)
      # deploys the upload with the server's own trusted Deploy.ps1 and writes back status.txt.
      - name: Get the deploy scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: src

      - name: Write SSH key and pinned host key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY_PRODUCTION }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: allotjar-up-prod
        run: src/.github/scripts/write-ssh-config.sh

      - name: Upload the release and wait for the server to deploy it
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-production
        run: src/.github/scripts/upload-deploy.sh production
