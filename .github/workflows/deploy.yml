name: Deploy to beta

# Auto-deploys to the BETA environment (app.allotjar.com) whenever code lands on
# main (i.e. after a PR merge). Beta is the rolling staging/UAT + public-beta env:
# the SPA is built with VITE_APP_ENV=beta so it carries the under-construction
# banner + the registration data-loss acknowledgment.
#
# Promotion to PRODUCTION is a separate, manual, approval-gated workflow:
# .github/workflows/promote-to-production.yml. The public production URL
# (allotjar.com / www) is the Cloudflare-Pages "coming soon" page until GA.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two beta deploys run at once.
concurrency:
  group: beta-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build release (beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Framework-dependent win-x64 publish. The .NET Hosting Bundle on the VPS
      # supplies the runtime + ASP.NET Core Module; publish emits the ANCM web.config.
      - name: Publish API
        run: >
          dotnet publish src/ZeroBudget.Api/ZeroBudget.Api.csproj
          -c Release -r win-x64 --no-self-contained -o publish/api

      - name: Build SPA
        working-directory: client
        # VITE_* vars are inlined into the bundle at build time. VITE_APP_ENV=beta
        # turns on the beta banner + data-loss consent; the GA build sets it to
        # 'production' (see promote-to-production.yml).
        env:
          VITE_APP_ENV: beta
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Assemble release package
        run: |
          mkdir -p release/api release/web
          cp -r publish/api/. release/api/
          cp -r client/dist/. release/web/
          cp deploy/web/web.config release/web/web.config
          cp deploy/Deploy.ps1 release/Deploy.ps1
          cd release && zip -qr ../release.zip . && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip
          retention-days: 7

  deploy:
    name: deploy to beta VPS
    needs: build
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      # Native OpenSSH (SFTP-based), NOT appleboy/scp-action: drone-scp pipes tar
      # through the remote shell, which fails against Windows OpenSSH + a PowerShell
      # default shell. Native scp/ssh use the SFTP subsystem and a single command,
      # which is shell-independent and works on Windows.
      - name: Write SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # The scp below writes straight into C:\deploy\incoming, so that folder (and
      # the staging folder the extract step expands into) must exist. They normally
      # persist on the VPS, but if either goes missing the scp fails with
      # "dest open ...: No such file or directory" and blocks every deploy. Create
      # them first so a transient missing dir can't break the pipeline.
      - name: Ensure VPS deploy dirs exist
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path C:\deploy\incoming, C:\deploy\staging | Out-Null"'

      - name: Copy release to VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            release.zip "$USER@$HOST:C:/deploy/incoming/release.zip"

      # Deploy.ps1 with no args targets the existing IIS stack (C:\inetpub\zerobudget\*,
      # pools ZeroBudget-Api/-Web) — the same box that is being relabelled as beta.
      - name: Extract and deploy on VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -ExecutionPolicy Bypass -Command "Remove-Item C:\deploy\staging\* -Recurse -Force -ErrorAction SilentlyContinue; Expand-Archive -Path C:\deploy\incoming\release.zip -DestinationPath C:\deploy\staging -Force; & C:\deploy\staging\Deploy.ps1"'
