name: Deploy

# One pipeline, two environments, every merge to main:
#
#   build-staging ──► deploy-staging (auto)          staging.allotjar.com
#                                    └► deploy-production (manual run only)
#   build-production ────────────────┘               allotjar.com / www
#
# * STAGING auto-deploys on every merge. It is the IP-allowlisted test environment
#   (Cloudflare WAF rule) with the amber staging banner + data-loss signup consent
#   (VITE_APP_ENV=staging) and NO GA measurement ID (analytics stays inert there).
# * PRODUCTION deploys only when the owner starts this workflow by hand (Actions >
#   Deploy > Run workflow, branch main, "Also deploy to production" ticked). A
#   merge never reaches production on its own. This replaces the `production`
#   environment's required reviewer: GitHub ignores environment protection rules
#   on a private repository on the Free, Pro and Team plans, so that gate stopped
#   applying when the repo went private (3 Oct 2026). The production job still
#   runs AFTER deploy-staging in the same run, so nothing reaches production that
#   staging didn't get first.
# * Both stacks live on the same VPS and reuse the same repo-level VPS_* SSH secrets.
#   Every server-side name says which stack it belongs to:
#     staging     C:\inetpub\zerobudget-staging\{api,web}, pools ZeroBudget-Staging-Api/-Web,
#                 API :5000, ASPNETCORE_ENVIRONMENT=Staging (appsettings.Staging.json),
#                 database ZeroBudgetStaging, release unpacked in C:\deploy\release-staging
#     production  C:\inetpub\zerobudget-prod\{api,web}, pools ZeroBudget-Prod-Api/-Web,
#                 API :5001, ASPNETCORE_ENVIRONMENT=Production (appsettings.Production.json),
#                 database ZeroBudgetProd, release unpacked in C:\deploy\release-production
#
# The staging and production bundles differ at build time (banner/consent/GA are
# inlined by Vite), so each environment builds its own artifact - "build once,
# deploy many" intentionally does NOT apply.
on:
  push:
    branches: [main]
    # A docs-only merge changes nothing that ships, so it does not redeploy staging.
    # Run the workflow by hand to force a deploy.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      production:
        description: 'Also deploy to production (after staging). Leave unticked to redeploy staging only.'
        type: boolean
        required: false
        default: false

jobs:
  build-staging:
    name: build release (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Framework-dependent win-x64 publish. The .NET Hosting Bundle on the VPS
      # supplies the runtime + ASP.NET Core Module; publish emits the ANCM web.config.
      - name: Publish API
        run: >
          dotnet publish src/AllotJar.Api/AllotJar.Api.csproj
          -c Release -r win-x64 --no-self-contained -o publish/api

      - name: Build SPA
        working-directory: client
        # VITE_APP_ENV=staging turns on the staging banner + data-loss consent.
        # VITE_GA_MEASUREMENT_ID is deliberately NOT set: absent => analytics is
        # disabled entirely, so staging traffic never pollutes GA.
        # VITE_GOOGLE_CLIENT_ID is likewise NOT set: staging's API has no Google
        # config, so a rendered button would only produce failing sign-ins.
        env:
          VITE_APP_ENV: staging
        run: |
          npm ci
          npm run build

      - name: Assemble release package
        run: |
          mkdir -p release/api release/web
          cp -r publish/api/. release/api/
          cp -r client/dist/. release/web/
          cp deploy/web/web.config release/web/web.config
          cp deploy/Deploy.ps1 release/Deploy.ps1
          cp deploy/ProvisionHelpers.psm1 release/ProvisionHelpers.psm1
          cd release && zip -qr ../release.zip . && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-staging
          path: release.zip
          retention-days: 1

  deploy-staging:
    name: deploy to staging
    needs: build-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    # Serialize staging deploys without ever blocking on a production deploy
    # below - hence job-level, not workflow-level, groups.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-staging

      # Native OpenSSH (SFTP-based), NOT appleboy/scp-action: drone-scp pipes tar
      # through the remote shell, which fails against Windows OpenSSH + a PowerShell
      # default shell. Native scp/ssh use the SFTP subsystem and a single command,
      # which is shell-independent and works on Windows.
      - name: Write SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # The scp below writes straight into C:\deploy\incoming-staging, so that folder
      # (and the release folder the extract step expands into) must exist, or the scp
      # fails with "dest open ...: No such file or directory".
      - name: Ensure VPS deploy dirs exist
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path C:\deploy\incoming-staging, C:\deploy\release-staging | Out-Null"'

      - name: Copy release to VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            release.zip "$USER@$HOST:C:/deploy/incoming-staging/release.zip"

      # Deploy.ps1's defaults are the staging stack; they are passed anyway so this job
      # and the production one below read the same way. -AspNetEnvironment Staging makes
      # the API read appsettings.Staging.json.
      - name: Extract and deploy on VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -ExecutionPolicy Bypass -Command "Remove-Item C:\deploy\release-staging\* -Recurse -Force -ErrorAction SilentlyContinue; Expand-Archive -Path C:\deploy\incoming-staging\release.zip -DestinationPath C:\deploy\release-staging -Force; & C:\deploy\release-staging\Deploy.ps1 -ApiDir C:\inetpub\zerobudget-staging\api -WebDir C:\inetpub\zerobudget-staging\web -ApiPool ZeroBudget-Staging-Api -WebPool ZeroBudget-Staging-Web -HealthUrl http://127.0.0.1:5000/health -ApiProxyPort 5000 -AspNetEnvironment Staging"'

  # Production ships only a commit whose CI on main passed. Journey and a11y run on
  # main, not on PRs, and this workflow never waited for CI, so without this check a
  # red main could reach production.
  ci-passed:
    name: CI passed on this commit
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read # the compare API below answers 404 without it, and every CI run was skipped
    steps:
      # Docs-only commits do not run CI (ci.yml paths-ignore), so for a docs-only head
      # this looks back to the newest earlier commit that did run it and requires every
      # commit since to touch docs only. Code that never ran CI is refused.
      - name: Check the CI run for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Every GitHub call goes through here: retried, and a call that still fails
          # stops the gate with GitHub's own error. A failed call is never read as an
          # empty or "unrelated" answer, so the gate cannot approve on a call it did not get.
          gh_api() {
            local out err n
            err=$(mktemp)
            for n in 1 2 3; do
              if out=$(gh api "$@" 2>"$err"); then printf '%s' "$out"; rm -f "$err"; return 0; fi
              # GitHub's own "not found" is an answer, not an outage: not retried, and
              # told apart (status 44) so a caller may treat it as a real negative.
              if grep -q 'HTTP 404' "$err"; then
                echo "GitHub API call answered 404: gh api $*" >&2; cat "$err" >&2
                rm -f "$err"; return 44
              fi
              echo "GitHub API call failed (attempt $n of 3): gh api $*" >&2; cat "$err" >&2
              [ "$n" -lt 3 ] && sleep $((n * 3))
            done
            rm -f "$err"
            return 1
          }
          refuse() { echo "::error::$1 Production is not deployed."; exit 1; }
          verdict() { # $1 run sha, $2 status, $3 conclusion
            echo "CI on main for $1: $2 $3"
            case "$2 $3" in
              "completed success") exit 0 ;;
              completed*) refuse "CI on main for $1 did not pass ($2 $3)." ;;
              *) refuse "CI on main for $1 has not finished ($2 $3). Start this run again once it has." ;;
            esac
          }
          # Only runs on main count: a run of the same commit on another branch (PR CI skips
          # the journey and a11y jobs) must not stand in for main's CI.
          FIELDS='.workflow_runs[] | select(.head_branch == "main" and .event != "pull_request") | "\(.head_sha) \(.status) \(.conclusion // "")"'

          # The run for this exact commit, asked for by SHA: the newest-first list below
          # is sometimes served stale and can miss it.
          own=$(gh_api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=10" --jq "$FIELDS") \
            || refuse "Could not read the CI runs for $SHA."
          while read -r run_sha status conclusion; do
            [ -z "$run_sha" ] && continue
            verdict "$run_sha" "$status" "$conclusion"
          done <<< "$own"

          # No run for this commit (docs-only head): the newest earlier run it descends
          # from, provided nothing but docs changed since. The list is read unfiltered and
          # narrowed to main by FIELDS: GitHub's branch= and event= listings have been
          # served stuck on an old run (5 Oct), the unfiltered one was current.
          runs=$(gh_api "repos/$REPO/actions/workflows/ci.yml/runs?per_page=100" --jq "$FIELDS") \
            || refuse "Could not list the CI runs on main."
          while read -r run_sha status conclusion; do
            [ -z "$run_sha" ] && continue
            rc=0
            cmp=$(gh_api "repos/$REPO/compare/$run_sha...$SHA" --jq '"\(.status) \(.total_commits)"') || rc=$?
            # A 404 means GitHub cannot relate the two commits (for example a run whose commit
            # is gone): that run is not an ancestor, so look at the next one.
            [ "$rc" -eq 44 ] && continue
            [ "$rc" -eq 0 ] || refuse "Could not compare $run_sha with $SHA."
            case "${cmp%% *}" in
              identical|ahead) ;;
              diverged|behind) continue ;; # a real answer: this run is not an ancestor of the commit
              *) refuse "Unexpected compare status '${cmp%% *}' for $run_sha...$SHA." ;;
            esac
            if [ "${cmp%% *}" = ahead ]; then
              files=$(gh_api --paginate "repos/$REPO/compare/$run_sha...$SHA" --jq '.files[].filename') \
                || refuse "Could not list the files changed since $run_sha."
              # --paginate can repeat a file once per page of commits; count each file once.
              files=$(printf '%s\n' "$files" | sort -u)
              # A range that is ahead by commits must list files; an empty answer is not "docs only".
              [ -n "$files" ] \
                || refuse "GitHub listed no files changed since the last CI run on main ($run_sha), so it cannot be checked as docs only."
              # The compare API lists at most 300 files: past that the list is incomplete.
              [ "$(printf '%s' "$files" | grep -c .)" -lt 300 ] \
                || refuse "Too many files changed since the last CI run on main ($run_sha) to check that they are docs only."
              code=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$' | grep . || true)
              if [ -n "$code" ]; then
                echo "$code"
                refuse "Code changed since the last CI run on main ($run_sha) and $SHA has no CI run."
              fi
              echo "$SHA is docs-only after $run_sha; using that CI run."
            fi
            verdict "$run_sha" "$status" "$conclusion"
          done <<< "$runs"
          refuse "No CI run found on main at or before $SHA among the newest 100 CI runs (a 404 from the compare calls can also mean the token lacks contents: read)."

  build-production:
    name: build release (production)
    needs: ci-passed
    # Production builds and deploys only on a hand-started run from main with the
    # production box ticked; a merge (push) skips both production jobs.
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Publish API
        run: >
          dotnet publish src/AllotJar.Api/AllotJar.Api.csproj
          -c Release -r win-x64 --no-self-contained -o publish/api

      - name: Build SPA
        working-directory: client
        # Production bundle: no banner, no extra consent, GA measurement ID and the
        # (public) Google OAuth client id inlined. Absent VITE_GOOGLE_CLIENT_ID =>
        # the Sign in with Google button simply doesn't render.
        env:
          VITE_APP_ENV: production
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Assemble release package
        run: |
          mkdir -p release/api release/web
          cp -r publish/api/. release/api/
          cp -r client/dist/. release/web/
          cp deploy/web/web.config release/web/web.config
          cp deploy/Deploy.ps1 release/Deploy.ps1
          cp deploy/ProvisionHelpers.psm1 release/ProvisionHelpers.psm1
          cd release && zip -qr ../release.zip . && cd ..

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-production
          path: release.zip
          retention-days: 7

  deploy-production:
    name: deploy to production (manual run)
    # Staging must have deployed this commit first. The manual gate is the hand-started
    # run itself; the condition is repeated from build-production so this job can never
    # run on a merge. Production deploys queue one at a time.
    needs: [build-production, deploy-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-production

      - name: Write SSH key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ensure VPS deploy dirs exist
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path C:\deploy\incoming-production, C:\deploy\release-production | Out-Null"'

      - name: Copy release to VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            release.zip "$USER@$HOST:C:/deploy/incoming-production/release.zip"

      # The production stack is Deploy.ps1 with the production dirs/pools/ports; the SQL
      # database is never touched by a deploy. -ApiProxyPort patches the copied
      # web.config so the front site proxies /api to the prod API on :5001, and
      # -AspNetEnvironment Production makes the API read appsettings.Production.json.
      - name: Extract and deploy on VPS
        env:
          PORT: ${{ secrets.VPS_SSH_PORT }}
          USER: ${{ secrets.VPS_SSH_USER }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$USER@$HOST" \
            'powershell -NoProfile -ExecutionPolicy Bypass -Command "Remove-Item C:\deploy\release-production\* -Recurse -Force -ErrorAction SilentlyContinue; Expand-Archive -Path C:\deploy\incoming-production\release.zip -DestinationPath C:\deploy\release-production -Force; & C:\deploy\release-production\Deploy.ps1 -ApiDir C:\inetpub\zerobudget-prod\api -WebDir C:\inetpub\zerobudget-prod\web -ApiPool ZeroBudget-Prod-Api -WebPool ZeroBudget-Prod-Web -HealthUrl http://127.0.0.1:5001/health -ApiProxyPort 5001 -AspNetEnvironment Production"'
