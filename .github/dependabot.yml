# Dependabot keeps dependencies patched and opens security-fix PRs automatically.
# Covers the .NET packages, the React client's npm tree, and the GitHub Actions we pin.
# Minor/patch bumps are grouped into a single PR per ecosystem to cut noise; majors come
# as their own PRs so they can be reviewed individually.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        update-types: ["minor", "patch"]
    # FluentAssertions 8+ and MediatR 13+ moved to a commercial licence; this project
    # deliberately stays on the free lines (7.2.0 / 12.4.1). Ignore those majors so
    # Dependabot stops re-raising them (see closed PRs #91 and #92).
    ignore:
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      - dependency-name: "MediatR"
        versions: [">=13.0.0"]

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"