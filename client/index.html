<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/allotjar-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/png/allotjar-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/png/allotjar-favicon-16.png" />
    <!-- The square (full-bleed) app icon: the iPhone home screen cuts its own rounded shape.
         Bump ?v= (here and in manifest.webmanifest) whenever the icon art changes: the PNGs
         keep their names and browsers and Cloudflare cache them. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/png/allotjar-app-icon-maskable-180.png?v=2" />
    <!-- Installable app (PWA): name, icons and start page. The service worker is registered
         from src/lib/serviceWorker.ts; it only shows /offline.html when a page can't load. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F6B4D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AllotJar — Zero-Based Budgeting App</title>
    <meta
      name="description"
      content="Give every euro a job. AllotJar is a zero-based budgeting app for households: plan the month to zero, set a little aside in jars for the big bills, and budget together from one shared budget — in your currency, the way you write it."
    />
    <link rel="canonical" href="https://www.allotjar.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, …). These are read from the
         served HTML by non-JS scrapers, so they live here, not in the SPA. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AllotJar" />
    <meta property="og:title" content="AllotJar — Zero-Based Budgeting App" />
    <meta
      property="og:description"
      content="Give every euro a job. AllotJar is a zero-based budgeting app for households: plan the month to zero, jars for the big bills, one shared budget — in your currency."
    />
    <meta property="og:url" content="https://www.allotjar.com/" />
    <meta property="og:image" content="https://www.allotjar.com/og/allotjar-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AllotJar — give every euro a job" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AllotJar — Zero-Based Budgeting App" />
    <meta
      name="twitter:description"
      content="Give every euro a job. Zero-based budgeting for households, in your currency."
    />
    <meta name="twitter:image" content="https://www.allotjar.com/og/allotjar-og.png" />
    <meta name="twitter:image:alt" content="AllotJar — give every euro a job" />

    <!-- Structured data: a SoftwareApplication so search engines can show a rich
         result. A JSON-LD data block is not executable script, so the strict CSP
         `script-src 'self'` does not block it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AllotJar",
        "applicationCategory": "FinanceApplication",
        "applicationSubCategory": "Budgeting",
        "operatingSystem": "Web",
        "url": "https://www.allotjar.com/",
        "description": "Give every euro a job. AllotJar is a zero-based budgeting app for households: plan the month to zero, set a little aside in jars for the big bills, and budget together from one shared budget — in your currency, the way you write it.",
        "image": "https://www.allotjar.com/og/allotjar-og.png",
        "inLanguage": "en",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "publisher": { "@type": "Organization", "name": "AllotJar", "url": "https://www.allotjar.com/" }
      }
    </script>

    <!-- External (not inline) so a strict CSP `script-src 'self'` covers it; still
         render-blocking in <head>, so the theme is applied before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
