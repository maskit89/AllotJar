<!doctype html>
<!--
  Shown by the service worker (sw.js) when a page can't be reached. Self-contained: the worker
  keeps a copy of this file and of the theme script, nothing else, so it renders with no
  connection. The look follows the boot splash (App.tsx, .splash in index.css): the sage page
  deepening into its floor, the wordmark, then one line and one button. "Try again" reloads
  the address that failed (an empty href is the page's own URL).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6B4D" />
    <meta name="robots" content="noindex" />
    <title>Offline · AllotJar</title>
    <script src="/theme-init.js?offline"></script>
    <style>
      :root {
        --page: #e3eae4;
        --ink: #15201b;
        --muted: #52625a;
        --accent: #1f6b4d;
        --gold: #d7a93e;
        --button: #1f6b4d;
        --button-hover: #155239;
        --floor: color-mix(in srgb, var(--page) 90%, #1f6b4d);
        --glow: color-mix(in srgb, var(--page) 84%, #1f6b4d);
        color-scheme: light;
      }
      .dark {
        --page: #0e1311;
        --ink: #e9f0eb;
        --muted: #9db0a6;
        --accent: #5fc093;
        --gold: #e8c36a;
        --button: #2a7d5a;
        --button-hover: #1f6b4d;
        --floor: color-mix(in srgb, var(--page) 88%, #1f6b4d);
        --glow: color-mix(in srgb, var(--page) 80%, #1f6b4d);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px 12vh;
        text-align: center;
      }
      main::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 45% 0 0;
        pointer-events: none;
        background:
          radial-gradient(60% 70% at 50% 100%, var(--glow), transparent 70%),
          linear-gradient(180deg, transparent, var(--floor) 70%);
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand span {
        color: var(--accent);
      }
      h1 {
        margin: 32px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--muted);
      }
      a {
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 24px;
        border-radius: 8px;
        background: var(--button);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s;
      }
      a:hover {
        background: var(--button-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stack">
        <div class="brand">
          <svg width="30" height="40" viewBox="0 0 64 84" fill="none" aria-hidden="true">
            <path
              d="M17 19L17 25C17 30 9 31 9 39L9 66A13 13 0 0 0 22 79L42 79A13 13 0 0 0 55 66L55 39C55 31 47 30 47 25L47 19Z"
              fill="var(--accent)"
            />
            <path d="M9 48Q32 45 55 48L55 66A13 13 0 0 1 42 79L22 79A13 13 0 0 1 9 66Z" fill="var(--gold)" />
            <rect x="13" y="14.5" width="38" height="5" rx="2.5" fill="var(--gold)" />
            <rect x="15" y="3.5" width="34" height="12.5" rx="3.5" fill="var(--gold)" />
            <rect x="16.5" y="4.8" width="31" height="2.6" rx="1.3" fill="#ffffff" opacity=".28" />
          </svg>
          <div>Allot<span>Jar</span></div>
        </div>
        <h1>You're offline</h1>
        <a href="">Try again</a>
      </div>
    </main>
  </body>
</html>
